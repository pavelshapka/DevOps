services:
  mysql:
    image: mysql:9.6
    env_file:
      - ./react-spring-app/.env
    volumes:
      - mysql_data:/var/lib/mysql

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./proxy_nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./react-spring-app/react-frontend/
      dockerfile: Dockerfile
    env_file:
      - ./react-spring-app/react-frontend/.env

  backend:
    build:
      context: ./react-spring-app/spring-backend/
      dockerfile: Dockerfile
    env_file:
      - ./react-spring-app/.env
    environment:
      - DB_HOST=mysql
    depends_on:
      - mysql

volumes:
  mysql_data: