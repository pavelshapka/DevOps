events {}

http {
    include /etc/nginx/mime.types;

    upstream front-upstream {
        server frontend:80;
    }

    upstream back-upstream {
        server backend:8080;
    }

    server {
        listen 3000;
        server_name react-spring-app;

        location /api/v1 {
            proxy_pass http://back-upstream;
        }

        location / {
            proxy_pass http://front-upstream;
        }
    }
}
